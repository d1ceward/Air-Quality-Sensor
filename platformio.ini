; -----------------------------------------------------------------------------
; PlatformIO Project Configuration File
; -----------------------------------------------------------------------------
; Documentation: https://docs.platformio.org/page/projectconf.html
; This file centralizes build, library and environment settings.
; -----------------------------------------------------------------------------

[platformio]
default_envs = d1_mini
description = Air Quality Sensor (ESP8266 D1 Mini) - modularized project structure

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -Wall
  -Wextra
  -Werror=return-type
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

[env:d1_mini]
platform = espressif8266
board = d1_mini
lib_deps =
	airgradienthq/AirGradient Air Quality Sensor@^3.3.9
	arduino-libraries/NTPClient@^3.2.1
	sensirion/arduino-sht@^1.2.6
	olikraus/U8g2@^2.36.12
	tzapu/WiFiManager@^2.0.17

; Future (optional) native host test environment (add pure C++ logic there)
; [env:native]
; platform = native
; build_flags = -Wall -Wextra -Werror=return-type
