; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini
description = Air Quality Sensor (ESP8266) - Prometheus metrics, web UI, OTA

[env]
build_flags =
	-Wall
	-Wextra
	-Werror=return-type

; Settings shared by every firmware environment. Kept out of [env] so the host test environment does not
; inherit the Arduino framework.
[esp8266_base]
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
; The suites under test/ are host tests: they need neither the board nor the Arduino framework. Without this,
; "pio test" builds them for the ESP8266 and fails on Adafruit BusIO, which pulls in SPI.h that nothing else
; references.
test_ignore = *
build_flags =
	${env.build_flags}
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-DBEARSSL_SSL_BASIC

[env:d1_mini]
extends = esp8266_base
platform = espressif8266
board = d1_mini
board_build.filesystem = littlefs
; 1 MB app / 1 MB LittleFS, leaves room for OTA
board_build.ldscript = eagle.flash.4m1m.ld
upload_speed = 921600
lib_deps =
	sensirion/arduino-sht@^1.2.6
	adafruit/Adafruit BMP085 Library@^1.2.4
	robtillaart/SGP30@^0.3.3
	olikraus/U8g2@^2.36.12
	bblanchon/ArduinoJson@^7.4.2

; Over-the-air upload: pio run -e d1_mini_ota -t upload
;
; The two values below are the compiled-in defaults, so they work on a device that has never been
; configured. Once the admin password has been changed, which it should be, override them from the
; environment instead of writing the real one here and committing it:
;   PLATFORMIO_UPLOAD_PORT=sensor.local \
;   PLATFORMIO_UPLOAD_FLAGS=--auth=... pio run -e d1_mini_ota -t upload
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = air-quality.local
upload_flags =
	--auth=airquality

; Host tests for the logic that does not touch the hardware: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
	+<aqi.cpp>
	+<barometry.cpp>
	+<battery_curve.cpp>
	+<display_schedule.cpp>
	+<history.cpp>
	+<hostname.cpp>
	+<modbus_crc.cpp>
	+<prom_text.cpp>
	+<uptime.cpp>
	+<sensors/pms_frame.cpp>
build_flags =
	${env.build_flags}
	-std=gnu++17
