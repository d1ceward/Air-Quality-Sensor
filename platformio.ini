; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini
description = Air Quality Sensor (ESP8266) - Prometheus metrics, web UI, OTA

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
build_flags =
	-Wall
	-Wextra
	-Werror=return-type
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-DBEARSSL_SSL_BASIC

[env:d1_mini]
platform = espressif8266
board = d1_mini
board_build.filesystem = littlefs
; 1 MB app / 1 MB LittleFS, leaves room for OTA
board_build.ldscript = eagle.flash.4m1m.ld
upload_speed = 921600
lib_deps =
	sensirion/arduino-sht@^1.2.6
	robtillaart/SGP30@^0.3.3
	olikraus/U8g2@^2.36.12
	bblanchon/ArduinoJson@^7.4.2

; Over-the-air upload: pio run -e d1_mini_ota -t upload
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
; Set to the sensor address (or hostname.local) and the OTA password from config.json
upload_port = air-quality.local
upload_flags =
	--auth=airquality
