<svg xmlns="http://www.w3.org/2000/svg" width="250" height="160" viewBox="0 0 500 320" role="img" aria-label="Air Quality Sensor showing temperature, humidity, pressure, CO2, PM2.5 and TVOC on its OLED display">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#d9dce1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- enclosure -->
  <rect x="20" y="20" width="460" height="280" rx="28" fill="url(#body)" stroke="#b9bec6" stroke-width="3"/>
  <!-- intake vents -->
  <g fill="#aeb4bd">
    <rect x="48" y="244" width="70" height="8" rx="4"/>
    <rect x="48" y="262" width="70" height="8" rx="4"/>
    <rect x="382" y="244" width="70" height="8" rx="4"/>
    <rect x="382" y="262" width="70" height="8" rx="4"/>
  </g>
  <!-- status led -->
  <circle cx="250" cy="257" r="6" fill="#3ccf6e"/>
  <!-- OLED module, the 128x64 page drawn at 2x -->
  <rect x="106" y="44" width="288" height="176" rx="10" fill="#1d2430"/>
  <g transform="translate(122 60)">
    <rect width="256" height="128" fill="#05070a"/>
    <g fill="#9fd8ff" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
      <text x="4" y="20" font-size="24">21.4°C</text>
      <text x="138" y="18" font-size="13">1016hPa</text>
      <text x="254" y="20" font-size="24" text-anchor="end">48%</text>
      <text x="4" y="60" font-size="22">CO2</text>
      <text x="92" y="60" font-size="22">PM2.5</text>
      <text x="182" y="60" font-size="22">TVOC</text>
      <text x="4" y="94" font-size="26">612</text>
      <text x="92" y="94" font-size="26">4</text>
      <text x="182" y="94" font-size="26">87</text>
      <text x="4" y="124" font-size="22">ppm</text>
      <text x="92" y="124" font-size="22">ug/m³</text>
      <text x="182" y="124" font-size="22">ppb</text>
    </g>
    <rect width="256" height="128" fill="url(#glass)"/>
  </g>
</svg>
