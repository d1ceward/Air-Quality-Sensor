name: Build
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version shown in the web UI and the metrics comes from config.h, so a tag that disagrees with it
      # would publish a firmware reporting the wrong version.
      - name: Check tag against PROJECT_VERSION
        run: |
          VERSION=$(grep -oP 'PROJECT_VERSION\[\] = "\K[^"]+' include/config.h)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match PROJECT_VERSION ${VERSION} in include/config.h"
            exit 1
          fi
      - name: PlatformIO cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build firmware
        run: |
          pio run -e d1_mini
          mv .pio/build/d1_mini/firmware.bin air-quality-sensor-d1_mini.bin
      - name: Upload firmware to action artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: air-quality-sensor-d1_mini
          path: ./air-quality-sensor-d1_mini.bin
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Named with an explicit path: downloading every artifact only nests each one in a folder of its name
      # when there are several, so with a single artifact the file lands at the root instead.
      - name: Download firmware from action artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: air-quality-sensor-d1_mini
          path: firmware
      - name: Create draft release with firmware
        uses: d1ceward/release-upload-action@be20febaff3a508280c2d8592052a85123c117a6 # v5.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./firmware/air-quality-sensor-d1_mini.bin
